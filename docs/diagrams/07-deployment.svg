<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" width="1020" height="560">
<rect width="1020" height="560" fill="#FFFFFF"/>
<defs>
<marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#475569"/></marker>
<marker id="aa" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#0284C7"/></marker>
<marker id="ab" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#F04438"/></marker>
</defs>
<text x="28" y="34" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0F172A" font-weight="bold" text-anchor="start">Figure 7 — Deployment topologies</text>
<text x="28" y="54" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#475569" font-weight="normal" text-anchor="start">Four ways to run it. They differ in one property that matters: whether the agent can route around us.</text>
<rect x="34" y="96" width="224" height="226" rx="6" fill="#FEF3F2" stroke="#FDA29B" stroke-width="1.2"/>
<rect x="34" y="96" width="5" height="226" rx="2.5" fill="#F04438"/>
<text x="48" y="113" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0F172A" font-weight="bold" text-anchor="start">SDK  /  in-process</text>
<text x="48" y="129.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#475569" font-weight="normal" text-anchor="start">pip install, minutes</text>
<text x="48" y="141.5" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#475569" font-weight="normal" text-anchor="start">richest context available</text>
<text x="48" y="154.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#475569" font-weight="normal" text-anchor="start"></text>
<text x="48" y="166.5" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#475569" font-weight="normal" text-anchor="start">an attacker with code execution</text>
<text x="48" y="179.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#475569" font-weight="normal" text-anchor="start">inside the agent can disable it</text>
<rect x="48" y="268" width="108" height="20" rx="10.0" fill="#F04438"/>
<text x="102.0" y="281.2" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#FFFFFF" font-weight="bold" text-anchor="middle">BYPASS: NONE</text>
<text x="48" y="308" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#475569" font-weight="bold" text-anchor="start">Developers, OSS adoption</text>
<rect x="280" y="96" width="224" height="226" rx="6" fill="#F0F9FF" stroke="#38BDF8" stroke-width="1.2"/>
<rect x="280" y="96" width="5" height="226" rx="2.5" fill="#F79009"/>
<text x="294" y="113" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0F172A" font-weight="bold" text-anchor="start">MCP wrapper</text>
<text x="294" y="129.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#475569" font-weight="normal" text-anchor="start">stdio and HTTP</text>
<text x="294" y="141.5" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#475569" font-weight="normal" text-anchor="start">zero code change to the agent</text>
<text x="294" y="154.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#475569" font-weight="normal" text-anchor="start"></text>
<text x="294" y="166.5" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#475569" font-weight="normal" text-anchor="start">covers any MCP-speaking agent;</text>
<text x="294" y="179.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#475569" font-weight="normal" text-anchor="start">does not see non-MCP traffic</text>
<rect x="294" y="268" width="108" height="20" rx="10.0" fill="#F79009"/>
<text x="348.0" y="281.2" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#FFFFFF" font-weight="bold" text-anchor="middle">BYPASS: GOOD</text>
<text x="294" y="308" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#475569" font-weight="bold" text-anchor="start">OSS and Pro</text>
<rect x="526" y="96" width="224" height="226" rx="6" fill="#F0F9FF" stroke="#38BDF8" stroke-width="1.2"/>
<rect x="526" y="96" width="5" height="226" rx="2.5" fill="#12B76A"/>
<text x="540" y="113" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0F172A" font-weight="bold" text-anchor="start">Companion proxy</text>
<text x="540" y="129.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#475569" font-weight="normal" text-anchor="start">sidecar plus NetworkPolicy</text>
<text x="540" y="141.5" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#475569" font-weight="normal" text-anchor="start">separate process boundary</text>
<text x="540" y="154.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#475569" font-weight="normal" text-anchor="start"></text>
<text x="540" y="166.5" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#475569" font-weight="normal" text-anchor="start">the cluster enforces that the</text>
<text x="540" y="179.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#475569" font-weight="normal" text-anchor="start">agent can only reach us</text>
<rect x="540" y="268" width="108" height="20" rx="10.0" fill="#12B76A"/>
<text x="594.0" y="281.2" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#FFFFFF" font-weight="bold" text-anchor="middle">BYPASS: STRONG</text>
<text x="540" y="308" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#475569" font-weight="bold" text-anchor="start">Enterprise, self-hosted</text>
<rect x="772" y="96" width="224" height="226" rx="6" fill="#F0F9FF" stroke="#38BDF8" stroke-width="1.2"/>
<rect x="772" y="96" width="5" height="226" rx="2.5" fill="#12B76A"/>
<text x="786" y="113" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0F172A" font-weight="bold" text-anchor="start">Managed gateway</text>
<text x="786" y="129.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#475569" font-weight="normal" text-anchor="start">hosted, multi-tenant</text>
<text x="786" y="141.5" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#475569" font-weight="normal" text-anchor="start">no infrastructure to run</text>
<text x="786" y="154.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#475569" font-weight="normal" text-anchor="start"></text>
<text x="786" y="166.5" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#475569" font-weight="normal" text-anchor="start">same boundary as the proxy,</text>
<text x="786" y="179.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#475569" font-weight="normal" text-anchor="start">operated by us</text>
<rect x="786" y="268" width="108" height="20" rx="10.0" fill="#12B76A"/>
<text x="840.0" y="281.2" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#FFFFFF" font-weight="bold" text-anchor="middle">BYPASS: STRONG</text>
<text x="786" y="308" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#475569" font-weight="bold" text-anchor="start">Cloud customers</text>
<rect x="34" y="348" width="958" height="63.5" rx="6" fill="#F0F9FF" stroke="#38BDF8" stroke-width="1"/>
<text x="46" y="365" font-family="Helvetica, Arial, sans-serif" font-size="9.2" fill="#0284C7" font-weight="bold" text-anchor="start">The structural tension, and how we resolve it</text>
<text x="46" y="380.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#475569" font-weight="normal" text-anchor="start">The form factor that drives adoption is the one that cannot enforce. An in-process library fails the reference-monitor requirement that the monitor cannot be modified by</text>
<text x="46" y="392.5" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#475569" font-weight="normal" text-anchor="start">what it monitors — so the SDK is documented as an instrumentation and decision client, not as the security boundary. Every decision sits behind one interface with two</text>
<text x="46" y="405.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#475569" font-weight="normal" text-anchor="start">implementations, local and remote, so the same policy runs in all four topologies and moving up the ladder is a configuration change, not a rewrite.</text>
<rect x="34" y="462" width="958" height="38.5" rx="6" fill="#F0F9FF" stroke="#38BDF8" stroke-width="1"/>
<text x="46" y="479" font-family="Helvetica, Arial, sans-serif" font-size="9.2" fill="#0284C7" font-weight="bold" text-anchor="start">What we say publicly</text>
<text x="46" y="494.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#475569" font-weight="normal" text-anchor="start">Overclaiming here is the fastest way to lose the security community we are trying to recruit from. Each topology ships with its bypass resistance stated plainly in the documentation.</text>
</svg>
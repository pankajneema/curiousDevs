<text x="962" y="443" font-family="Helvetica, Arial, sans-serif" font-size="7.6" fill="#0284C7" font-weight="bold" text-anchor="end" letter-spacing="1">PROOF</text>
<rect x="34" y="494" width="958" height="63.5" rx="6" fill="#F0F9FF" stroke="#38BDF8" stroke-width="1"/>
<text x="46" y="511" font-family="Helvetica, Arial, sans-serif" font-size="9.2" fill="#0284C7" font-weight="bold" text-anchor="start">Why these two are the only irreversible decision in the plan</text>
<text x="46" y="526.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#475569" font-weight="normal" text-anchor="start">Policy matches on them. The log stores them. Replay reconstructs from them. The compliance export is a projection of them, and the bridge to CurioComply depends on that projection staying stable.</text>
<text x="46" y="538.5" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#475569" font-weight="normal" text-anchor="start">Audit records outlive the code by years, so the schemas live in a neutral IDL under semver with a migration path. The provenance and delegation fields are present from v1 even before they are enforced —</text>
<text x="46" y="551.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#475569" font-weight="normal" text-anchor="start">adding them later would mean re-issuing every record ever written.</text>
</svg>
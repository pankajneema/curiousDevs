<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560">
<rect width="980" height="560" fill="#FFFFFF"/>
<defs>
<marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#475569"/></marker>
<marker id="aa" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#0284C7"/></marker>
<marker id="ab" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#F04438"/></marker>
</defs>
<text x="28" y="34" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0F172A" font-weight="bold" text-anchor="start">Figure 2 — The five channels</text>
<text x="28" y="54" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#475569" font-weight="normal" text-anchor="start">Complete mediation means all five. A gap in any one is a security hole, not a missing feature.</text>
<rect x="40" y="96" width="210" height="300" rx="6" fill="#FEF3F2" stroke="#FDA29B" stroke-width="1.2"/>
<rect x="40" y="96" width="5" height="300" rx="2.5" fill="#F04438"/>
<text x="54" y="113" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0F172A" font-weight="bold" text-anchor="start">AI agent process</text>
<text x="54" y="129.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" fill="#475569" font-weight="normal" text-anchor="start">model + orchestration</text>
<text x="54" y="141.5" font-family="Helvetica, Arial, sans-serif" font-size="8.8" fill="#475569" font-weight="normal" text-anchor="start"></text>
<text x="54" y="154.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" fill="#475569" font-weight="normal" text-anchor="start">assumed compromised</text>
<rect x="298" y="96" width="30" height="52" rx="6" fill="#0284C7"/>
<text x="313" y="129" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text>
<rect x="336" y="96" width="246" height="52" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="347" y="113" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0F172A" font-weight="bold" text-anchor="start">Tool invocation</text>
<text x="347" y="129.0" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#475569" font-weight="normal" text-anchor="start">function calls, MCP calls, API calls</text>
<rect x="618" y="96" width="334" height="52" rx="6" fill="#F0F9FF" stroke="#38BDF8" stroke-width="1.2"/>
<text x="629" y="113" font-family="Helvetica, Arial, sans-serif" font-size="9.8" fill="#0F172A" font-weight="bold" text-anchor="start">Six-stage decision pipeline</text>
<line x1="252" y1="122" x2="294" y2="122" stroke="#F04438" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="584" y1="122" x2="614" y2="122" stroke="#0284C7" stroke-width="1.4" marker-end="url(#aa)"/>
<rect x="298" y="158" width="30" height="52" rx="6" fill="#0284C7"/>
<text x="313" y="191" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle">2</text>
<rect x="336" y="158" width="246" height="52" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="347" y="175" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0F172A" font-weight="bold" text-anchor="start">Model API call</text>
<text x="347" y="191.0" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#475569" font-weight="normal" text-anchor="start">the full context window, every turn</text>
<rect x="618" y="158" width="334" height="52" rx="6" fill="#F0F9FF" stroke="#38BDF8" stroke-width="1.2"/>
<text x="629" y="175" font-family="Helvetica, Arial, sans-serif" font-size="9.8" fill="#0F172A" font-weight="bold" text-anchor="start">Egress proxy: pinned provider and model, prompt DLP</text>
<line x1="252" y1="184" x2="294" y2="184" stroke="#F04438" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="584" y1="184" x2="614" y2="184" stroke="#0284C7" stroke-width="1.4" marker-end="url(#aa)"/>
<rect x="298" y="220" width="30" height="52" rx="6" fill="#0284C7"/>
<text x="313" y="253" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle">3</text>
<rect x="336" y="220" width="246" height="52" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="347" y="237" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0F172A" font-weight="bold" text-anchor="start">Output to user</text>
<text x="347" y="253.0" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#475569" font-weight="normal" text-anchor="start">rendered markdown, links, images, code</text>
<rect x="618" y="220" width="334" height="52" rx="6" fill="#F0F9FF" stroke="#38BDF8" stroke-width="1.2"/>
<text x="629" y="237" font-family="Helvetica, Arial, sans-serif" font-size="9.8" fill="#0F172A" font-weight="bold" text-anchor="start">Response inspection: strip auto-fetch, rewrite links</text>
<line x1="252" y1="246" x2="294" y2="246" stroke="#F04438" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="584" y1="246" x2="614" y2="246" stroke="#0284C7" stroke-width="1.4" marker-end="url(#aa)"/>
<rect x="298" y="282" width="30" height="52" rx="6" fill="#0284C7"/>
<text x="313" y="315" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle">4</text>
<rect x="336" y="282" width="246" height="52" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="347" y="299" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0F172A" font-weight="bold" text-anchor="start">Memory &amp; state writes</text>
<text x="347" y="315.0" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#475569" font-weight="normal" text-anchor="start">long-term memory, RAG index, vectors</text>
<rect x="618" y="282" width="334" height="52" rx="6" fill="#F0F9FF" stroke="#38BDF8" stroke-width="1.2"/>
<text x="629" y="299" font-family="Helvetica, Arial, sans-serif" font-size="9.8" fill="#0F172A" font-weight="bold" text-anchor="start">Mediated writes, provenance stored with the item</text>
<line x1="252" y1="308" x2="294" y2="308" stroke="#F04438" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="584" y1="308" x2="614" y2="308" stroke="#0284C7" stroke-width="1.4" marker-end="url(#aa)"/>
<rect x="298" y="344" width="30" height="52" rx="6" fill="#0284C7"/>
<text x="313" y="377" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle">5</text>
<rect x="336" y="344" width="246" height="52" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="347" y="361" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0F172A" font-weight="bold" text-anchor="start">Network egress</text>
<text x="347" y="377.0" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#475569" font-weight="normal" text-anchor="start">any socket the process opens</text>
<rect x="618" y="344" width="334" height="52" rx="6" fill="#F0F9FF" stroke="#38BDF8" stroke-width="1.2"/>
<text x="629" y="361" font-family="Helvetica, Arial, sans-serif" font-size="9.8" fill="#0F172A" font-weight="bold" text-anchor="start">Deny-by-default destination policy</text>
<line x1="252" y1="370" x2="294" y2="370" stroke="#F04438" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="584" y1="370" x2="614" y2="370" stroke="#0284C7" stroke-width="1.4" marker-end="url(#aa)"/>
<rect x="40" y="424" width="912" height="76.0" rx="6" fill="#F0F9FF" stroke="#38BDF8" stroke-width="1"/>
<text x="52" y="441" font-family="Helvetica, Arial, sans-serif" font-size="9.2" fill="#0284C7" font-weight="bold" text-anchor="start">Why this framing replaces a module list</text>
<text x="52" y="456.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#475569" font-weight="normal" text-anchor="start">The original design mediated channel 1 only. Channels 2, 3 and 5 are each independently sufficient for total data exfiltration:</text>
<text x="52" y="468.5" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#475569" font-weight="normal" text-anchor="start">channel 2 carries every byte the agent has read this session; channel 3 needs no network call from the agent at all — the user's client makes</text>
<text x="52" y="481.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#475569" font-weight="normal" text-anchor="start">the request when it renders a markdown image; channel 5 makes the tool allowlist advisory rather than enforced.</text>
<text x="52" y="493.5" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#475569" font-weight="normal" text-anchor="start">An attacker does not attack the guarded channel. Closing all five is the Phase 1 exit criterion.</text>
</svg>
<rect x="28" y="599" width="10" height="10" rx="2.5" fill="#F04438"/>
<text x="43" y="607.5" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#475569" font-weight="normal" text-anchor="start">untrusted / assumed compromised</text>

<text x="500" y="450" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#0284C7" font-weight="normal" text-anchor="start">only what policy allowed</text>
<rect x="700" y="190" width="252" height="96" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<rect x="700" y="190" width="5" height="96" rx="2.5" fill="#7A5AF8"/>
<text x="714" y="207" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#0F172A" font-weight="bold" text-anchor="start">Enterprise systems</text>
<text x="714" y="223.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" fill="#475569" font-weight="normal" text-anchor="start">Identity provider  —  SSO, agent identity</text>
<text x="714" y="235.5" font-family="Helvetica, Arial, sans-serif" font-size="8.8" fill="#475569" font-weight="normal" text-anchor="start">SIEM  —  decision events out</text>
<text x="714" y="248.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" fill="#475569" font-weight="normal" text-anchor="start">Secrets manager  —  short-lived credentials</text>

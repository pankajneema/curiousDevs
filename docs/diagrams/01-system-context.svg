<text x="42" y="89" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#0284C7" font-weight="bold" text-anchor="start" letter-spacing="1.4">PEOPLE</text>
<rect x="46" y="100" width="200" height="56" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>

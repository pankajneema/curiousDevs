<text x="42" y="207" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#0F172A" font-weight="bold" text-anchor="start">Threat intelligence</text>
<text x="42" y="223.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" fill="#475569" font-weight="normal" text-anchor="start">Known-bad MCP servers,</text>
<text x="42" y="235.5" font-family="Helvetica, Arial, sans-serif" font-size="8.8" fill="#475569" font-weight="normal" text-anchor="start">malicious tool digests,</text>
<text x="42" y="248.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" fill="#475569" font-weight="normal" text-anchor="start">injection payload families</text>

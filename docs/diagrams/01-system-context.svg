<text x="224.925" y="607.5" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#475569" font-weight="normal" text-anchor="start">AgentGuard</text>
<rect x="293.675" y="599" width="10" height="10" rx="2.5" fill="#475569"/>
<text x="308.675" y="607.5" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#475569" font-weight="normal" text-anchor="start">systems under protection</text>

<text x="28" y="34" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0F172A" font-weight="bold" text-anchor="start">Figure 6 — Flight recorder</text>
<text x="28" y="54" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#475569" font-weight="normal" text-anchor="start">Tamper-evident evidence. Designed as a regulator-facing artefact first, a debugging log second.</text>
<rect x="34" y="92" width="250" height="78" rx="6" fill="#F0F9FF" stroke="#38BDF8" stroke-width="1.2"/>
<rect x="34" y="92" width="5" height="78" rx="2.5" fill="#0284C7"/>
<text x="48" y="109" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0F172A" font-weight="bold" text-anchor="start">Decision Engine</text>
<text x="48" y="125.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" fill="#475569" font-weight="normal" text-anchor="start">emits one DecisionRecord</text>
<text x="48" y="137.5" font-family="Helvetica, Arial, sans-serif" font-size="8.8" fill="#475569" font-weight="normal" text-anchor="start">per mediated action</text>
<line x1="288" y1="131" x2="316" y2="131" stroke="#0284C7" stroke-width="1.4" marker-end="url(#aa)"/>
<text x="302.0" y="122" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#475569" font-weight="normal" text-anchor="middle">async</text>
<rect x="322" y="92" width="250" height="78" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<rect x="322" y="92" width="5" height="78" rx="2.5" fill="#0284C7"/>
<text x="336" y="109" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0F172A" font-weight="bold" text-anchor="start">Write path</text>
<text x="336" y="125.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" fill="#475569" font-weight="normal" text-anchor="start">hash computed synchronously</text>
<text x="336" y="137.5" font-family="Helvetica, Arial, sans-serif" font-size="8.8" fill="#475569" font-weight="normal" text-anchor="start">storage write never blocks</text>
<line x1="572" y1="131" x2="604" y2="131" stroke="#0284C7" stroke-width="1.4" marker-end="url(#aa)"/>
<rect x="610" y="92" width="382" height="78" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<rect x="610" y="92" width="5" height="78" rx="2.5" fill="#0284C7"/>
<text x="624" y="109" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0F172A" font-weight="bold" text-anchor="start">Merkle tree  (RFC 9162 model)</text>
<text x="624" y="125.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" fill="#475569" font-weight="normal" text-anchor="start">append-only; the structure Certificate Transparency uses</text>
<text x="624" y="137.5" font-family="Helvetica, Arial, sans-serif" font-size="8.8" fill="#475569" font-weight="normal" text-anchor="start">signed tree heads published on a fixed cadence</text>
<rect x="34" y="196" width="470" height="190" rx="9" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="48" y="214" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#0284C7" font-weight="bold" text-anchor="start" letter-spacing="1.4">TREE STRUCTURE</text>
<rect x="228" y="228" width="84" height="24" rx="5" fill="#0284C7"/>
<text x="270" y="244" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#FFFFFF" font-weight="bold" text-anchor="middle">root hash</text>

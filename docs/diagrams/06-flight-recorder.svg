<text x="300" y="353" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="8.4" fill="#475569" font-weight="normal" text-anchor="middle">record</text>
<line x1="300" y1="338" x2="348" y2="308" stroke="#CBD5E1" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="358" y="338" width="76" height="22" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
<text x="396" y="353" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="8.4" fill="#475569" font-weight="normal" text-anchor="middle">record</text>
<line x1="396" y1="338" x2="348" y2="308" stroke="#CBD5E1" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="524" y="196" width="468" height="88" rx="6" fill="#F0F9FF" stroke="#38BDF8" stroke-width="1.2"/>
<rect x="524" y="196" width="5" height="88" rx="2.5" fill="#0284C7"/>
<text x="538" y="213" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0F172A" font-weight="bold" text-anchor="start">What the two proofs give you</text>
<text x="538" y="229.0" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#475569" font-weight="normal" text-anchor="start">Inclusion proof   —  this exact record is in the log</text>
<text x="538" y="241.5" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#475569" font-weight="normal" text-anchor="start">Consistency proof —  this log is an append-only extension of an earlier one</text>
<text x="538" y="254.0" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#475569" font-weight="normal" text-anchor="start">Together they answer the only question a regulator asks: has anything been removed?</text>
<rect x="524" y="298" width="468" height="88" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<rect x="524" y="298" width="5" height="88" rx="2.5" fill="#F79009"/>
<text x="538" y="315" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0F172A" font-weight="bold" text-anchor="start">Anchoring — tamper-evident against whom?</text>
<text x="538" y="331.0" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#475569" font-weight="normal" text-anchor="start">A hash chain alone can be recomputed by an insider with database access.</text>
<text x="538" y="343.5" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#475569" font-weight="normal" text-anchor="start">Signed tree heads are published to a store the operator cannot rewrite:</text>
<text x="538" y="356.0" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#475569" font-weight="normal" text-anchor="start">customer-controlled by default, optionally a CuriosDevs transparency log.</text>
<text x="34" y="420" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#0284C7" font-weight="bold" text-anchor="start" letter-spacing="1.4">WHAT THE LOG PRODUCES</text>
<rect x="34" y="434" width="220" height="62" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<rect x="34" y="434" width="5" height="62" rx="2.5" fill="#0284C7"/>
<text x="48" y="451" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#0F172A" font-weight="bold" text-anchor="start">Session replay</text>
<text x="48" y="467.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#475569" font-weight="normal" text-anchor="start">reconstruct what the agent</text>
<text x="48" y="479.5" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#475569" font-weight="normal" text-anchor="start">saw, decided and did</text>
<rect x="280" y="434" width="220" height="62" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<rect x="280" y="434" width="5" height="62" rx="2.5" fill="#0284C7"/>
<text x="294" y="451" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#0F172A" font-weight="bold" text-anchor="start">Verdict re-derivation</text>
<text x="294" y="467.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#475569" font-weight="normal" text-anchor="start">re-run a past decision against</text>
<text x="294" y="479.5" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#475569" font-weight="normal" text-anchor="start">its own policy version</text>
<rect x="526" y="434" width="220" height="62" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<rect x="526" y="434" width="5" height="62" rx="2.5" fill="#12B76A"/>
<text x="540" y="451" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#0F172A" font-weight="bold" text-anchor="start">Evidence export</text>
<text x="540" y="467.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#475569" font-weight="normal" text-anchor="start">EU AI Act Art. 12, SOC 2,</text>
<text x="540" y="479.5" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#475569" font-weight="normal" text-anchor="start">ISO 27001 / 42001, DPDP</text>
<rect x="772" y="434" width="220" height="62" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<rect x="772" y="434" width="5" height="62" rx="2.5" fill="#12B76A"/>
<text x="786" y="451" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#0F172A" font-weight="bold" text-anchor="start">Independent verifier</text>
<text x="786" y="467.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#475569" font-weight="normal" text-anchor="start">published, cross-language;</text>
<text x="786" y="479.5" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#475569" font-weight="normal" text-anchor="start">a third party can check us</text>
<rect x="34" y="518" width="958" height="51.0" rx="6" fill="#F0F9FF" stroke="#38BDF8" stroke-width="1"/>
<text x="46" y="535" font-family="Helvetica, Arial, sans-serif" font-size="9.2" fill="#0284C7" font-weight="bold" text-anchor="start">Two constraints that shape the design</text>
<text x="46" y="550.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#475569" font-weight="normal" text-anchor="start">Retention floor is six months because EU AI Act Article 12 requires it, and that article also requires logging to be integrated into the core design — a bolted-on audit layer does not satisfy it.</text>
<text x="46" y="562.5" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#475569" font-weight="normal" text-anchor="start">Payload bodies are stored as digests by default. An audit product that retains raw tool arguments becomes a PII store, and we would be selling our customers a new breach alongside their compliance.</text>
</svg>
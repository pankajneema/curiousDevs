<rect x="58" y="338" width="76" height="22" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
<text x="96" y="353" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="8.4" fill="#475569" font-weight="normal" text-anchor="middle">record</text>
<line x1="96" y1="338" x2="150" y2="308" stroke="#CBD5E1" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="166" y="338" width="76" height="22" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
<text x="204" y="353" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="8.4" fill="#475569" font-weight="normal" text-anchor="middle">record</text>
